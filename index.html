<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>LU MENG JIN — Portfolio</title>

<!-- ============================================================
     字型 Fonts — Fraunces（標題用襯線）＋ Sora（內文/介面用無襯線）
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   0. 色票 / DESIGN TOKENS
   來源：使用者提供的新色票
   Space Cadet #25344F｜Slate Gray #617891｜Tan #D5B893
   Coffee #6F4D38｜Caput Mortuum #632024

   下面沿用原本的變數名稱（--seashell、--wheat…）當作「角色別名」，
   只是把實際顏色換成新色票，這樣其餘 CSS 不用整份改寫也能套用新配色。
   之後如果只想再微調色彩，改這幾行新色票變數即可。
   ============================================================ */
:root{
  /* 新色票（五色為主）*/
  --space-cadet:   #25344F;
  --slate-gray:    #D0E9ED;
  --tan:           #D5B893;
  --coffee:        #6F4D38;
  --caput-mortuum: #632024;

  /* 角色別名：main = 主要文字色 / muted = 次要文字 / accent = 互動強調色 */
  --seashell:      var(--tan);            /* 主要文字 / 亮面（原角色由 Tan 擔任） */
  --wheat:         var(--tan);            /* 強調文字（同樣使用 Tan，靠背景襯托做出區隔） */
  --powder-blue:   var(--slate-gray);     /* 次要文字 / 分隔線 */
  --french-blue:   var(--caput-mortuum);  /* 主色 — 連結 / 按鈕 / active 狀態 */
  --midnight:      var(--space-cadet);    /* 背景基底 */
  --midnight-deep: #161F2F;               /* Space Cadet 的深化版，用於漸層與卡片底 */

  --bg:            var(--midnight);
  --bg-elevated:   var(--coffee);
  --text-main:     var(--seashell);
  --text-muted:    var(--powder-blue);
  --accent:        var(--french-blue);
  --accent-soft:   #854E45;               /* Caput Mortuum 與 Tan 混色，hover 用的柔化強調色 */
  --highlight:     var(--wheat);

  --font-display:  'Fraunces', Georgia, serif;
  --font-body:     'Sora', -apple-system, sans-serif;

  --max-width:     1240px;
  --gap:           28px;
  --radius:        2px;

  --ease: cubic-bezier(.22,.61,.36,1);
}

*{ box-sizing:border-box; margin:0; padding:0; }

html{
  scroll-behavior:smooth;
}
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}

body{
  padding-top:var(--header-h, 110px); /* 由 JS 依實際 header 高度動態設定 */
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(99,32,36,0.22), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(111,77,56,0.10), transparent 55%),
    var(--bg);
  color:var(--text-main);
  font-family:var(--font-body);
  font-weight:400;
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
img{ display:block; max-width:100%; }
ul{ list-style:none; }

::selection{ background:var(--accent); color:var(--seashell); }

:focus-visible{
  outline: 2px solid var(--wheat);
  outline-offset: 3px;
}

.wrap{
  max-width:var(--max-width);
  margin:0 auto;
  padding:0 40px;
}
@media (max-width:768px){
  .wrap{ padding:0 22px; }
}

/* ============================================================
   1. HEADER
   ============================================================ */
header.site-header{
  position:fixed;
  top:0; left:0; right:0;
  z-index:100;
  background:rgba(22,31,47,0.86);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(97,120,145,0.15);
  transition:transform .4s var(--ease);
}
/* 往下滑動時整條 header 隱藏，只有回到頁面最上方（含點擊 Back to top）才會再出現 */
header.site-header.header-hidden{
  transform:translateY(-100%);
}
.header-inner{
  max-width:var(--max-width);
  margin:0 auto;
  padding:22px 40px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
}
@media (max-width:768px){
  .header-inner{ padding:18px 22px; }
}

.brand{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.brand .name-en{
  font-family:var(--font-display);
  font-size:22px;
  font-weight:500;
  letter-spacing:0.08em;
  color:var(--wheat);
}
.brand .name-zh{
  font-size:12px;
  letter-spacing:0.25em;
  color:var(--text-muted);
  font-weight:400;
}
.brand .role{
  font-size:13px;
  color:var(--text-muted);
  margin-top:6px;
  max-width:260px;
}

nav.nav-desktop{
  display:flex;
  gap:36px;
  padding-top:6px;
}
nav.nav-desktop a{
  font-size:15px;
  letter-spacing:0.04em;
  color:var(--text-muted);
  position:relative;
  padding-bottom:6px;
  transition:color .25s var(--ease);
}
nav.nav-desktop a:hover{ color:var(--seashell); }
nav.nav-desktop a::after{
  content:'';
  position:absolute;
  left:0; bottom:0;
  height:2px;
  width:0;
  background:var(--french-blue);
  transition:width .3s var(--ease);
}
nav.nav-desktop a.active{ color:var(--seashell); }
nav.nav-desktop a.active::after{ width:100%; background:var(--wheat); }

@media (max-width:768px){
  nav.nav-desktop{ display:none; }
}

/* 漢堡選單 */
.hamburger{
  display:none;
  flex-direction:column;
  gap:5px;
  padding:10px;
  margin:-10px -10px 0 0;
}
.hamburger span{
  width:24px;
  height:2px;
  background:var(--seashell);
  transition:transform .3s var(--ease), opacity .3s var(--ease);
}
.hamburger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2){ opacity:0; }
.hamburger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }
@media (max-width:768px){
  .hamburger{ display:flex; }
}

.mobile-menu{
  position:fixed;
  inset:0;
  top:0;
  background:var(--midnight-deep);
  z-index:99;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:36px;
  transform:translateY(-100%);
  transition:transform .4s var(--ease);
  pointer-events:none;
}
.mobile-menu.open{
  transform:translateY(0);
  pointer-events:auto;
}
.mobile-menu a{
  font-family:var(--font-display);
  font-size:34px;
  color:var(--seashell);
  letter-spacing:0.05em;
}
.mobile-menu a.active{ color:var(--wheat); }
.mobile-menu .mm-sub{
  font-size:13px;
  letter-spacing:0.3em;
  color:var(--text-muted);
}

/* ============================================================
   2. VIEW SWITCH（單頁式 SPA：portfolio / project / resume）
   ============================================================ */
main{ min-height:70vh; }
.view{ animation:fadeIn .45s var(--ease); }
.view[hidden]{ display:none; }
@keyframes fadeIn{
  from{ opacity:0; transform:translateY(8px); }
  to{ opacity:1; transform:translateY(0); }
}

/* ============================================================
   3. PORTFOLIO 頁
   ============================================================ */
.portfolio-head{
  padding:64px 0 28px;
}
.portfolio-head h1{
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(30px, 4vw, 46px);
  color:var(--seashell);
  max-width:720px;
}
.portfolio-head h1 em{
  font-style:italic;
  color:var(--wheat);
}
.portfolio-head p{
  margin-top:14px;
  max-width:520px;
  color:var(--text-muted);
  font-size:15px;
}

.filter-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:6px 0 22px;
  border-bottom:1px solid rgba(97,120,145,0.18);
  margin-bottom:36px;
  scrollbar-width:none;
}
.filter-tabs::-webkit-scrollbar{ display:none; }
.filter-tabs button{
  flex:0 0 auto;
  padding:9px 18px;
  font-size:13px;
  letter-spacing:0.03em;
  color:var(--text-muted);
  border:1px solid rgba(97,120,145,0.3);
  border-radius:100px;
  transition:all .25s var(--ease);
  white-space:nowrap;
}
.filter-tabs button:hover{
  border-color:var(--wheat);
  color:var(--seashell);
}
.filter-tabs button.active{
  background:var(--french-blue);
  border-color:var(--french-blue);
  color:var(--seashell);
}

/* 作品縮圖：整排滿版寬、一件接一件往下排列（不管這個分類有幾件作品，
   每一張都是滿版寬，捲動就會看到下一件）。每張圖依原始比例顯示、不裁切。 */
.project-grid{
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  padding-bottom:100px;
}
/* All 分類：兩件作品一排（用 CSS Grid，不是 columns，不會有 Safari 的排版 bug） */
.project-grid.cols-2{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  align-items:start;
}
@media (max-width:700px){
  .project-grid.cols-2{ grid-template-columns:1fr; }
}
.project-card{
  display:block;
  width:100%;
  position:relative;
  overflow:hidden;
  border-radius:var(--radius);
  background:var(--bg-elevated);
  cursor:pointer;
  border:1px solid rgba(97,120,145,0.12);
}

.project-card img,
.project-card video{
  width:100%;
  height:auto;
  display:block;
  transition:transform .6s var(--ease);
}
.project-card:hover img,
.project-card:hover video{ transform:scale(1.04); }

.project-card .overlay{
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(22,31,47,0.95) 0%, rgba(22,31,47,0.35) 45%, transparent 75%);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:20px;
  opacity:0;
  transition:opacity .35s var(--ease);
}
.project-card:hover .overlay,
.project-card:focus-visible .overlay{ opacity:1; }

/* 觸控裝置：資訊常駐顯示，不用 hover */
@media (hover:none){
  .project-card .overlay{
    opacity:1;
    background:linear-gradient(to top, rgba(22,31,47,0.97) 0%, rgba(22,31,47,0.55) 40%, transparent 80%);
  }
}

.project-card .p-title{
  font-family:var(--font-display);
  font-size:19px;
  color:var(--seashell);
  margin-bottom:6px;
}
.project-card .p-meta{
  font-size:11.5px;
  letter-spacing:0.03em;
  color:var(--wheat);
  display:flex;
  flex-wrap:wrap;
  gap:5px 10px;
}
.project-card .p-meta span{ color:var(--powder-blue); }

/* ============================================================
   4. PROJECT DETAIL 頁
   ============================================================ */
.project-detail{ padding:52px 0 90px; }

.pd-back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--text-muted);
  margin-bottom:30px;
  transition:color .25s var(--ease);
}
.pd-back:hover{ color:var(--wheat); }

/* 圖片在左、文字說明在右 的內頁版型（參考站的排法）*/
.pd-top{
  display:grid;
  grid-template-columns: 1.6fr 1fr;
  gap:52px;
  align-items:start;
  margin-bottom:56px;
}
@media (max-width:900px){
  .pd-top{ grid-template-columns:1fr; gap:28px; }
}

.pd-hero{
  width:100%;
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--bg-elevated);
}
/* 不裁切：圖片依原始比例顯示（16:9 的圖就會維持 16:9） */
.pd-hero img,
.pd-hero video{ width:100%; height:auto; display:block; }

.pd-info{
  position:sticky;
  top:calc(var(--header-h, 110px) + 24px);
}
@media (max-width:900px){
  .pd-info{ position:static; }
}

.pd-eyebrow{
  font-size:11px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:14px;
}

.pd-title{
  font-family:var(--font-display);
  font-size:clamp(26px,3vw,38px);
  font-weight:500;
  color:var(--seashell);
  margin-bottom:18px;
}
.pd-desc{
  color:var(--powder-blue);
  font-size:15px;
  line-height:1.85;
  white-space:pre-line;
  margin-bottom:30px;
}

.pd-meta{ display:flex; flex-direction:column; gap:22px; }
.meta-row .meta-label{
  display:block;
  font-size:11px;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:var(--powder-blue);
  margin-bottom:10px;
}
.meta-row .year{
  font-family:var(--font-display);
  font-size:26px;
  color:var(--wheat);
}
.tag-row{ display:flex; flex-wrap:wrap; gap:8px; }
.tag{
  font-size:12.5px;
  padding:6px 13px;
  border-radius:100px;
  border:1px solid rgba(97,120,145,0.3);
  color:var(--seashell);
}
.tag.soft{ background:rgba(111,77,56,0.22); border-color:rgba(111,77,56,0.55); color:var(--wheat); }

/* 更多照片：跟首頁縮圖一樣採用 masonry，維持每張圖原本的比例，不裁切 */
.pd-gallery{
  margin-top:56px;
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:18px;
  align-items:start;
}
@media (max-width:700px){
  .pd-gallery{ grid-template-columns:1fr; }
}
.pd-gallery > div{
  border-radius:var(--radius);
  overflow:hidden;
}
.pd-gallery img,
.pd-gallery video{
  width:100%; height:auto; display:block;
}
.pd-gallery .full{ grid-column:1 / -1; }

.pd-video{
  margin-top:56px;
}
.video-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:var(--radius);
  overflow:hidden;
  background:#000;
}
.video-frame iframe{
  position:absolute; inset:0;
  width:100%; height:100%;
  border:0;
}

.pd-next{
  margin-top:80px;
  padding-top:36px;
  border-top:1px solid rgba(97,120,145,0.18);
}
.pd-next .next-label{
  font-size:11px;
  letter-spacing:0.2em;
  color:var(--text-muted);
  text-transform:uppercase;
  margin-bottom:16px;
}
.next-card{
  position:relative;
  display:block;
  aspect-ratio:16/6;
  border-radius:var(--radius);
  overflow:hidden;
}
.next-card img,
.next-card video{
  width:100%; height:100%; object-fit:cover;
  transition:transform .6s var(--ease), filter .4s var(--ease);
  filter:brightness(0.55);
}
.next-card:hover img,
.next-card:hover video{ transform:scale(1.05); filter:brightness(0.4); }
.next-card .nc-inner{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:flex-start; justify-content:center;
  padding:36px;
}
.next-card .nc-title{
  font-family:var(--font-display);
  font-size:clamp(24px,3.2vw,36px);
  color:var(--seashell);
}
@media (max-width:700px){
  .next-card{ aspect-ratio:4/3; }
}

/* ============================================================
   5. RESUME 頁
   ============================================================ */
.resume{ padding:64px 0 100px; }
.resume-top{
  display:flex;
  gap:48px;
  align-items:flex-start;
  margin-bottom:64px;
  flex-wrap:wrap;
}
.avatar{
  width:168px; height:168px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid var(--wheat);
  flex:0 0 auto;
  background:var(--bg-elevated);
}
.avatar img{ width:100%; height:100%; object-fit:cover; }

.resume-intro h1{
  font-family:var(--font-display);
  font-size:clamp(30px,4vw,44px);
  color:var(--seashell);
  margin-bottom:6px;
}
.resume-intro .r-role{
  color:var(--wheat);
  font-size:15px;
  letter-spacing:0.03em;
  margin-bottom:6px;
}
.resume-intro .r-loc{
  color:var(--text-muted);
  font-size:13.5px;
  margin-bottom:18px;
}
.social-row{ display:flex; gap:14px; }
.social-row a{
  width:40px; height:40px;
  border:1px solid rgba(97,120,145,0.35);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  transition:all .25s var(--ease);
}
.social-row a:hover{
  border-color:var(--wheat);
  background:rgba(111,77,56,0.22);
  transform:translateY(-2px);
}
.social-row svg{ width:18px; height:18px; stroke:var(--seashell); fill:none; }

.resume-section{
  max-width:760px;
  margin-bottom:56px;
}
.resume-section h2{
  font-family:var(--font-display);
  font-size:24px;
  color:var(--seashell);
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(97,120,145,0.2);
}
.resume-section p{
  color:var(--powder-blue);
  font-size:15.5px;
  line-height:1.9;
  margin-bottom:16px;
}

.skills-grid{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.skill-pill{
  font-size:13.5px;
  padding:9px 18px;
  border:1px solid rgba(97,120,145,0.3);
  border-radius:100px;
  color:var(--seashell);
  transition:all .25s var(--ease);
}
.skill-pill:hover{
  border-color:var(--french-blue);
  background:rgba(99,32,36,0.32);
}

/* ============================================================
   6. FOOTER / BACK TO TOP
   ============================================================ */
footer.site-footer{
  border-top:1px solid rgba(97,120,145,0.15);
  padding:26px 0;
}
.footer-inner{
  max-width:var(--max-width);
  margin:0 auto;
  padding:0 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  font-size:12.5px;
  color:var(--text-muted);
}
@media (max-width:768px){ .footer-inner{ padding:0 22px; } }

.back-to-top{
  display:inline-flex;
  align-items:center;
  gap:8px;
  letter-spacing:0.12em;
  color:var(--wheat);
  font-size:12px;
  text-transform:uppercase;
  transition:color .25s var(--ease), transform .25s var(--ease);
}
.back-to-top:hover{ color:var(--seashell); transform:translateY(-2px); }
.back-to-top svg{ width:13px; height:13px; stroke:currentColor; fill:none; }

/* 右下角浮動回頂端按鈕（滑動一段距離後出現）*/
.float-top{
  position:fixed;
  right:24px; bottom:24px;
  width:46px; height:46px;
  border-radius:50%;
  background:var(--french-blue);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transform:translateY(12px);
  transition:opacity .3s var(--ease), transform .3s var(--ease);
  z-index:90;
  box-shadow:0 8px 24px rgba(0,0,0,0.35);
}
.float-top.show{ opacity:1; pointer-events:auto; transform:translateY(0); }
.float-top svg{ width:18px; height:18px; stroke:var(--seashell); fill:none; }
.float-top:hover{ background:var(--accent-soft); }

</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="site-header">
  <div class="header-inner">
    <a href="#/portfolio" class="brand" data-nav>
      <span class="name-en">LU MENG JIN</span>
      <span class="name-zh">呂 孟 瑾</span>
      <span class="role" id="brandRole">3D Environment Artist</span>
    </a>

    <nav class="nav-desktop" id="navDesktop">
      <a href="#/portfolio" data-view-link="portfolio">Portfolio</a>
      <a href="#/resume" data-view-link="resume">Resume</a>
    </nav>

    <button class="hamburger" id="hamburgerBtn" aria-label="開啟選單" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ================= MOBILE MENU ================= -->
<div class="mobile-menu" id="mobileMenu">
  <a href="#/portfolio" data-view-link="portfolio">Portfolio</a>
  <a href="#/resume" data-view-link="resume">Resume</a>
  <span class="mm-sub">LU MENG JIN — 呂孟瑾</span>

const el = (sel) => document.querySelector(sel);
const els = (sel) => Array.from(document.querySelectorAll(sel));

/* -------- 圖片載入失敗時的暫用色塊（避免路徑錯誤時畫面壞掉） -------- */
function placeholderDataUri(label){
  const colors = ["#632024","#6F4D38","#25344F","#617891"];
  const c1 = colors[Math.floor(Math.random()*colors.length)];
  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg" width="800" height="500">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c1}"/>
        <stop offset="100%" stop-color="#161F2F"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#g)"/>
    <text x="50%" y="50%" fill="#D5B893" font-family="Georgia, serif" font-size="28"
      text-anchor="middle" dominant-baseline="middle" opacity="0.85">${label}</text>
  </svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}
function imgTag(src, alt, cls){
  const fallback = placeholderDataUri(alt || "LU MENG JIN");
  return `<img src="${src}" alt="${alt||''}" class="${cls||''}" loading="lazy"
    onerror="this.onerror=null;this.src='${fallback}'">`;
}

/* -------- cover / gallery 路徑如果是影片檔（.mp4 .mov .webm .m4v），
   改用 <video> 播放，而不是塞進 <img>（<img> 沒辦法播放影片檔）。
   建議優先用 .mp4，相容性比 .mov 好；.mov 在部分瀏覽器可能還是打不開。 -------- */
const VIDEO_EXT_RE = /\.(mp4|webm|mov|m4v)(\?.*)?$/i;
function mediaTag(src, alt, cls){
  if(VIDEO_EXT_RE.test(src)){
    return `<video src="${src}" class="${cls||''}" controls muted loop playsinline preload="metadata"></video>`;
  }
  return imgTag(src, alt, cls);
}

/* -------------------------- 路由 / Router -------------------------- */
function parseHash(){
  const hash = location.hash.replace(/^#\/?/, "");
  const parts = hash.split("/").filter(Boolean);
  if(parts[0] === "project" && parts[1]) return { view:"project", id: parts[1] };
  if(parts[0] === "resume") return { view:"resume" };
  if(parts[0] === "portfolio") return { view:"portfolio", filter: parts[1] ? decodeURIComponent(parts[1]) : "All" };
  return { view:"portfolio", filter:"All" };
}

function setActiveNav(view){
  els("[data-view-link]").forEach(a=>{
    a.classList.toggle("active", a.dataset.viewLink === view);
  });
}

function showView(name){
  ["portfolio","project","resume"].forEach(v=>{
    el("#view-"+v).hidden = (v!==name);
  });
}

function router(){
  const r = parseHash();
  setActiveNav(r.view === "project" ? "portfolio" : r.view);
  closeMobileMenu();

  if(r.view === "portfolio"){
    showView("portfolio");
    renderFilterTabs(r.filter);
    renderGrid(r.filter);
  } else if(r.view === "project"){
    showView("project");
    renderProjectDetail(r.id);
  } else if(r.view === "resume"){
    showView("resume");
    renderResume();
  }
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
}

/* -------------------------- Portfolio 渲染 -------------------------- */
function renderFilterTabs(active){
  const wrap = el("#filterTabs");
  wrap.innerHTML = CATEGORIES.map(cat=>`
    <button data-cat="${cat}" class="${cat===active?'active':''}">${cat}</button>
  `).join("");
  els("#filterTabs button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const cat = btn.dataset.cat;
      location.hash = cat==="All" ? "#/portfolio" : `#/portfolio/${encodeURIComponent(cat)}`;
    });
  });
}

function renderGrid(filter){
  const grid = el("#projectGrid");
  const list = filter==="All" ? PROJECTS : PROJECTS.filter(p=>p.categories.includes(filter));
  grid.classList.toggle("cols-2", filter==="All"); // All 分類：兩件作品一排；其他分類維持整排滿版寬
  grid.innerHTML = list.map(p=>`
    <a class="project-card" href="#/project/${p.id}" tabindex="0">
      ${mediaTag(p.cover, p.title)}
      <div class="overlay">
        <div class="p-title">${p.title}</div>
        <div class="p-meta">
          <span>${p.software.join(" · ")}</span>
        </div>
        <div class="p-meta" style="margin-top:2px;">
          <span>${p.categories.join(" / ")}</span><span>—</span><span>${p.year}</span>
        </div>
      </div>
    </a>
  `).join("") || `<p style="color:var(--text-muted);">目前這個分類還沒有作品。</p>`;
}

        <div class="nc-inner">
          <div class="nc-title">${next.title}</div>
        </div>
      </a>
    </div>
  `;
}

function toEmbed(url){
  // 支援貼一般 YouTube 連結，自動轉成 embed 格式
  try{
    const u = new URL(url);
    let id = "";
    if(u.hostname.includes("youtu.be")) id = u.pathname.slice(1);
    else if(u.pathname.includes("/embed/")) return url;
    else id = u.searchParams.get("v");
    return id ? `https://www.youtube.com/embed/${id}` : url;
  }catch(e){ return url; }
}

/* -------------------------- 導覽 / 選單 / 回頂端 -------------------------- */
function closeMobileMenu(){
  el("#mobileMenu").classList.remove("open");
  el("#hamburgerBtn").classList.remove("open");
  el("#hamburgerBtn").setAttribute("aria-expanded","false");
}

el("#hamburgerBtn").addEventListener("click", ()=>{
  const open = el("#mobileMenu").classList.toggle("open");
  el("#hamburgerBtn").classList.toggle("open", open);
  el("#hamburgerBtn").setAttribute("aria-expanded", String(open));
});

els("#mobileMenu a[data-view-link]").forEach(a=>{
  a.addEventListener("click", closeMobileMenu);
});

el("#floatTop").addEventListener("click", ()=>{
  window.scrollTo({top:0, behavior:"smooth"});
});

/* -------- 動態計算 header 高度，避免內容被固定 header 蓋住 -------- */
function syncHeaderHeight(){
  const h = el(".site-header").offsetHeight;
  document.documentElement.style.setProperty("--header-h", h + "px");
}
window.addEventListener("resize", syncHeaderHeight);
window.addEventListener("DOMContentLoaded", syncHeaderHeight);
syncHeaderHeight();

/* -------- 捲動時隱藏頂部 header，只有回到最上方（含按 Back to top）才會再出現 -------- */
const HEADER_SHOW_THRESHOLD = 10; // px
function updateHeaderVisibility(){
  const header = el(".site-header");
  const y = window.scrollY;
  el("#floatTop").classList.toggle("show", y > 480);
  if(y > HEADER_SHOW_THRESHOLD){
    header.classList.add("header-hidden");
  }else{
    header.classList.remove("header-hidden");
  }
}
window.addEventListener("scroll", updateHeaderVisibility, { passive:true });
updateHeaderVisibility();

/* 頁尾「Back to top」文字連結（每頁最下面都有） */
el("#backToTopLink").addEventListener("click", (e)=>{
  e.preventDefault();
  window.scrollTo({top:0, behavior:"smooth"});
});

/* 頁尾與品牌區塊帶入 profile 資料 */
el("#brandRole").textContent = PROFILE.role;
el("#footerName").textContent = `© ${PROFILE.nameEn} — All rights reserved`;

window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);
router();
</script>
